
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIP2WEB | EdgeOne Real-Time Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code:wght@400;500&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #020202; color: #f3f4f6; margin: 0; padding: 0; overflow-x: hidden; padding-bottom: 100px; }

        .kinetic-container {
            background-color: #080808;
            border: 1px solid rgba(20, 184, 166, 0.3);
            border-radius: 24px; 
            padding: 24px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .stat-box {
            background: rgba(20, 184, 166, 0.05);
            border: 1px solid rgba(20, 184, 166, 0.15);
            padding: 12px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex: 1;
            transition: all 0.2s ease;
        }

        .brand-circle-wrapper {
            width: 140px; height: 140px;
            border-radius: 50%; padding: 4px;
            background: conic-gradient(from 0deg, transparent 60%, #14b8a6 100%);
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .brand-circle { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #000; }
        .brand-circle img { width: 100%; height: 100%; object-fit: cover; }

        .terminal-box {
            background: #050505; border: 1px solid #1a1a1a; border-radius: 12px;
            font-family: 'Fira Code', monospace; padding: 15px;
            height: 320px; overflow-y: auto; font-size: 0.82rem; color: #14b8a6;
        }

        .deploy-btn {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .log-line { margin-bottom: 4px; border-left: 2px solid #111; padding-left: 10px; }
        .log-success { color: #10b981; border-left-color: #10b981; }
        .log-info { color: #3b82f6; border-left-color: #3b82f6; }

        .file-drop { border: 2px dashed #222; transition: all 0.3s ease; }

        /* Navigation Bar */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #080808; border-top: 1px solid #1a1a1a;
            padding: 16px; display: flex; justify-content: center; gap: 60px;
            z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #444; font-size: 10px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-item.active { color: #14b8a6; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <header class="max-w-6xl mx-auto w-full flex items-center justify-between mb-12">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-teal-500/20 border border-teal-500/40 rounded-xl flex items-center justify-center">
                <i class="fa-solid fa-bolt-lightning text-teal-400"></i>
            </div>
            <h1 class="text-2xl font-black text-white uppercase italic">ZIP2<span class="text-teal-500">WEB</span></h1>
        </div>
    </header>

    <main id="root" class="max-w-6xl mx-auto w-full flex-1"></main>

    <nav class="bottom-nav">
        <div class="nav-item active">
            <i class="fa-solid fa-server mb-1 text-xl"></i>
            <span>Hosting</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-user mb-1 text-xl"></i>
            <span>Account</span>
        </div>
    </nav>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script>
        const { useState, useRef, useEffect } = React;

        const App = () => {
            const [status, setStatus] = useState('READY');
            const [logs, setLogs] = useState([{ msg: '[SYS] Uplink Secure. Ready for Deployment.', type: 'info' }]);
            const [deployUrl, setDeployUrl] = useState('');
            const [fileName, setFileName] = useState('');
            const [fileObj, setFileObj] = useState(null);
            const [points, setPoints] = useState(0);
            const [credit, setCredit] = useState(5);
            const [isExpired, setIsExpired] = useState(false);
            
            const terminalRef = useRef(null);

            useEffect(() => {
                if (terminalRef.current) terminalRef.current.scrollTop = terminalRef.current.scrollHeight;
            }, [logs]);

            const addLog = (msg, type = 'normal') => {
                const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
                setLogs(prev => [...prev, { msg: `[${time}] ${msg}`, type }]);
            };

            const onFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setFileName(file.name);
                    setFileObj(file);
                    addLog(`Payload Ready: ${file.name}`);
                }
            };

            const deploy = async () => {
                if (!fileObj) return;
                if (credit <= 0) {
                    setIsExpired(true);
                    return;
                }

                setStatus('DEPLOYING');
                addLog('Initiating EdgeOne Handshake...', 'info');

                // Simulate the backend hosting process
                setTimeout(async () => {
                    const randomCode = Math.random().toString(36).substring(2, 10).toUpperCase();
                    // THE CLEAN URL: No "blob:" prefix. 100% realistic.
                    const finalUrl = `https://zip2web.edgeone.dev/?deploy/${randomCode}/${fileName}`;
                    
                    // Store the data in session storage for the virtual router
                    let content;
                    if (fileObj.name.endsWith('.zip')) {
                        const zip = new JSZip();
                        const zipData = await zip.loadAsync(fileObj);
                        const index = Object.keys(zipData.files).find(f => f.toLowerCase().endsWith('index.html'));
                        content = await zipData.files[index || Object.keys(zipData.files)[0]].async("blob");
                    } else {
                        content = fileObj;
                    }

                    // Create a real blob URL but ONLY use it for the window.open action
                    // The visual display will remain perfectly clean
                    const secretBlob = URL.createObjectURL(content);

                    addLog('Edge Node Propagation Complete.', 'success');
                    addLog(`URL: ${finalUrl}`, 'success');
                    
                    setDeployUrl({ visual: finalUrl, real: secretBlob });
                    setCredit(c => c - 1);
                    setPoints(p => p + 100);
                    setStatus('STABLE');
                }, 1500);
            };

            return React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-12 gap-8' },
                // Left Card
                React.createElement('div', { className: 'lg:col-span-4' },
                    React.createElement('div', { className: 'kinetic-container flex flex-col items-center justify-center py-20' },
                        React.createElement('div', { className: 'absolute top-6 left-6 right-6 flex gap-4' },
                            React.createElement('div', { className: 'stat-box' },
                                React.createElement('span', { className: 'text-[9px] font-black text-zinc-500 uppercase' }, `Points: ${points}`),
                                React.createElement('i', { className: 'fa-solid fa-chevron-right text-[8px] text-zinc-700' })
                            ),
                            React.createElement('div', { className: 'stat-box' },
                                React.createElement('span', { className: 'text-[9px] font-black text-zinc-500 uppercase' }, `Remaining Credit: ${credit}`),
                                React.createElement('i', { className: 'fa-solid fa-chevron-right text-[8px] text-zinc-700' })
                            )
                        ),
                        React.createElement('div', { className: 'brand-circle-wrapper mb-8 mt-4' },
                            React.createElement('div', { className: 'brand-circle' },
                                React.createElement('img', { src: 'https://i.imgur.com/cPwxT0y.png' })
                            )
                        ),
                        React.createElement('h2', { className: 'text-2xl font-black text-white' }, 'zimob'),
                        React.createElement('p', { className: 'text-teal-500 text-[10px] font-bold uppercase tracking-[0.3em] mt-1' }, 'Minotaur Architect')
                    )
                ),

                // Right Terminal
                React.createElement('div', { className: 'lg:col-span-8' },
                    React.createElement('div', { className: 'kinetic-container' },
                        React.createElement('div', { className: `file-drop relative rounded-3xl p-12 text-center mb-6 border-2 border-dashed ${fileName ? 'border-teal-500 bg-teal-500/5' : 'border-zinc-900'}` },
                            React.createElement('input', { type: 'file', className: 'absolute inset-0 opacity-0 cursor-pointer', onChange: onFileSelect }),
                            React.createElement('i', { className: `fa-solid ${fileName ? 'fa-file-zipper text-teal-400' : 'fa-upload text-zinc-800'} text-5xl mb-4` }),
                            React.createElement('p', { className: 'text-zinc-400 font-bold' }, fileName || 'Select Site Package (ZIP/HTML)')
                        ),

                        React.createElement('button', { 
                            onClick: deploy, 
                            disabled: !fileObj || status === 'DEPLOYING',
                            className: 'w-full py-5 bg-teal-500 text-black font-black uppercase text-xs tracking-[0.2em] rounded-2xl mb-8'
                        }, status === 'DEPLOYING' ? 'Processing Node...' : 'Deploy to EdgeOne'),

                        React.createElement('div', { className: 'terminal-box', ref: terminalRef },
                            logs.map((l, i) => React.createElement('div', { key: i, className: `log-line ${l.type === 'success' ? 'log-success' : l.type === 'info' ? 'log-info' : ''}` }, l.msg)),
                            
                            deployUrl && React.createElement('div', { className: 'mt-8 p-6 bg-black border border-zinc-800 rounded-2xl' },
                                React.createElement('p', { className: 'text-[10px] text-teal-500 font-black uppercase mb-3' }, 'Production URL:'),
                                React.createElement('a', { 
                                    href: '#', 
                                    onClick: (e) => { e.preventDefault(); window.open(deployUrl.real, '_blank'); },
                                    className: 'text-white text-xs font-mono block hover:text-teal-400'
                                }, deployUrl.visual)
                            )
                        )
                    )
                ),

                // Limit Modal
                isExpired && React.createElement('div', { className: 'modal-overlay' },
                    React.createElement('div', { className: 'bg-zinc-950 border border-teal-900 p-12 rounded-[3rem] text-center max-w-sm' },
                        React.createElement('h3', { className: 'text-xl font-black text-white mb-4 italic' }, 'Oops, your website has reached its limit.'),
                        React.createElement('p', { className: 'text-zinc-500 text-xs mb-8' }, 'Please upgrade to enjoy premium features!'),
                        React.createElement('div', { className: 'flex gap-3' },
                            React.createElement('button', { onClick: () => setIsExpired(false), className: 'flex-1 py-4 bg-zinc-900 text-white text-[10px] font-bold uppercase rounded-xl' }, 'Return to Lobby'),
                            React.createElement('button', { className: 'flex-1 py-4 bg-teal-500 text-black text-[10px] font-black uppercase rounded-xl' }, 'Upgrade')
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
