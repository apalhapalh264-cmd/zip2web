<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIP2WEB | EdgeOne Real-Time Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code:wght@400;500&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #020202; color: #f3f4f6; margin: 0; padding: 0; }

        .kinetic-container {
            background-color: #080808;
            border: 1px solid rgba(20, 184, 166, 0.3);
            border-radius: 24px; 
            padding: 24px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
        }

        .brand-circle-wrapper {
            width: 140px; height: 140px;
            border-radius: 50%; padding: 4px;
            background: conic-gradient(from 0deg, transparent 60%, #14b8a6 100%);
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .brand-circle { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #000; }
        .brand-circle img { width: 100%; height: 100%; object-fit: cover; }

        .terminal-box {
            background: #050505; border: 1px solid #1a1a1a; border-radius: 12px;
            font-family: 'Fira Code', monospace; padding: 15px;
            height: 320px; overflow-y: auto; font-size: 0.82rem; color: #14b8a6;
        }

        .deploy-btn {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .deploy-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 20px rgba(20, 184, 166, 0.4); }

        .log-line { margin-bottom: 4px; border-left: 2px solid #111; padding-left: 10px; }
        .log-success { color: #10b981; border-left-color: #10b981; }
        .log-info { color: #3b82f6; border-left-color: #3b82f6; }

        .file-drop { border: 2px dashed #222; transition: all 0.3s ease; }
        .file-drop.active { border-color: #14b8a6; background: rgba(20, 184, 166, 0.05); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: slideUp 0.5s ease forwards; }

        .url-display:hover { color: #2dd4bf; text-decoration: underline; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <header class="max-w-6xl mx-auto w-full flex items-center justify-between mb-12">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-teal-500/20 border border-teal-500/40 rounded-xl flex items-center justify-center">
                <i class="fa-solid fa-bolt-lightning text-teal-400"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-white uppercase italic">ZIP2<span class="text-teal-500">WEB</span></h1>
                <p class="text-[9px] text-zinc-500 font-bold uppercase tracking-widest">EdgeOne Cloud Interface</p>
            </div>
        </div>
        <div class="hidden md:block text-right">
            <p class="text-[10px] text-zinc-500 font-bold uppercase">Infrastructure Status</p>
            <p class="text-xs font-bold text-teal-500 uppercase">Operational</p>
        </div>
    </header>

    <main id="root" class="max-w-6xl mx-auto w-full flex-1"></main>

    <footer class="mt-12 text-center">
        <p class="text-[10px] text-zinc-700 font-black uppercase tracking-[0.4em]">
            ZIP2WEB Engine • Licensed to zimob • EdgeOne Dev
        </p>
    </footer>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script>
        const { useState, useRef, useEffect } = React;

        const App = () => {
            const [status, setStatus] = useState('READY');
            const [logs, setLogs] = useState([{ msg: '[SYS] Tencent Cloud EdgeOne Uplink Active.', type: 'info' }]);
            const [deployData, setDeployData] = useState(null);
            const [fileName, setFileName] = useState('');
            const [fileObject, setFileObject] = useState(null);
            const fileInputRef = useRef(null);
            const terminalRef = useRef(null);

            useEffect(() => {
                if (terminalRef.current) terminalRef.current.scrollTop = terminalRef.current.scrollHeight;
            }, [logs]);

            const addLog = (msg, type = 'normal') => {
                const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
                setLogs(prev => [...prev, { msg: `[${time}] ${msg}`, type }]);
            };

            const handleFileSelection = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setFileName(file.name);
                setFileObject(file);
                addLog(`Target Identified: ${file.name}`);
                setDeployData(null);
                setStatus('READY');
            };

            const executeDeploy = async () => {
                if (!fileObject) return;
                setStatus('DEPLOYING');
                addLog('Connecting to EdgeOne Secure Tunnel...', 'info');

                try {
                    const randomCode = Math.random().toString(36).substring(2, 12).toUpperCase();
                    const webName = "zip2web";
                    let internalUrl = "";

                    if (fileObject.name.endsWith('.zip')) {
                        addLog('Processing ZIP package contents...');
                        const zip = new JSZip();
                        const content = await zip.loadAsync(fileObject);
                        
                        const indexFile = Object.keys(content.files).find(name => name.toLowerCase().endsWith('index.html'));
                        if (indexFile) {
                            const blob = await content.files[indexFile].async("blob");
                            internalUrl = URL.createObjectURL(blob);
                            addLog(`Mapping entry point: ${indexFile}`, 'success');
                        } else {
                            const firstFile = Object.keys(content.files)[0];
                            const blob = await content.files[firstFile].async("blob");
                            internalUrl = URL.createObjectURL(blob);
                            addLog('Routing to primary node.', 'info');
                        }
                    } else {
                        // Standard HTML
                        internalUrl = URL.createObjectURL(fileObject);
                    }

                    setTimeout(() => {
                        addLog('Synchronizing with Global Edge Nodes...');
                        setTimeout(() => {
                            // The Clean Visual URL requested
                            const visualUrl = `https://${webName}.edgeone.dev/?deploy/${randomCode}/${fileObject.name}`;
                            addLog(`Live Link: ${visualUrl}`, 'success');
                            
                            setDeployData({ visual: visualUrl, real: internalUrl });
                            setStatus('STABLE');
                        }, 1200);
                    }, 800);

                } catch (err) {
                    addLog(`DEPLOYMENT FAILED: ${err.message}`, 'error');
                    setStatus('READY');
                }
            };

            // Function to handle the click and prevent showing the blob URL in the browser bar before navigation
            const handleLaunch = (e) => {
                e.preventDefault();
                if (deployData) {
                    window.open(deployData.real, '_blank');
                }
            };

            return React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-12 gap-6' },
                // Profile Column
                React.createElement('div', { className: 'lg:col-span-4' },
                    React.createElement('div', { className: 'kinetic-container h-full flex flex-col justify-center items-center py-12' },
                        React.createElement('div', { className: 'brand-circle-wrapper mb-8' },
                            React.createElement('div', { className: 'brand-circle' },
                                React.createElement('img', { src: 'https://i.imgur.com/cPwxT0y.png', alt: 'zimob' })
                            )
                        ),
                        React.createElement('h2', { className: 'text-2xl font-black text-white mb-1' }, 'zimob'),
                        React.createElement('p', { className: 'text-teal-500 text-[10px] font-bold uppercase tracking-[0.3em]' }, 'System Architect')
                    )
                ),

                // Control Column
                React.createElement('div', { className: 'lg:col-span-8' },
                    React.createElement('div', { className: 'kinetic-container' },
                        React.createElement('div', { className: 'flex justify-between items-center mb-6' },
                            React.createElement('h3', { className: 'text-xs font-black text-zinc-500 uppercase tracking-widest' }, 'Infrastructure Terminal'),
                            React.createElement('span', { className: `text-[10px] font-bold px-2 py-0.5 rounded border ${status === 'STABLE' ? 'border-teal-500 text-teal-500 shadow-[0_0_8px_rgba(20,184,166,0.3)]' : 'border-zinc-800 text-zinc-600'}` }, status)
                        ),

                        React.createElement('div', { className: `file-drop relative rounded-2xl p-8 text-center mb-6 border-2 transition-all ${fileName ? 'border-teal-500/50 bg-teal-500/5' : 'border-zinc-900 border-dashed'}` },
                            React.createElement('input', { 
                                type: 'file', className: 'absolute inset-0 w-full h-full opacity-0 cursor-pointer',
                                onChange: handleFileSelection, ref: fileInputRef, accept: '.zip,.html'
                            }),
                            React.createElement('i', { className: `fa-solid ${fileName ? 'fa-box-open text-teal-400' : 'fa-cloud-arrow-up text-zinc-800'} text-4xl mb-4` }),
                            React.createElement('p', { className: 'text-sm font-bold text-zinc-300' }, fileName || 'Select Payload (ZIP / HTML)'),
                            React.createElement('p', { className: 'text-[9px] text-zinc-600 uppercase mt-2 font-bold tracking-widest' }, 'EdgeOne Optimized Upload')
                        ),

                        React.createElement('button', { 
                            className: 'w-full deploy-btn py-4 rounded-xl text-black font-black text-xs uppercase tracking-widest mb-6 flex items-center justify-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed',
                            onClick: executeDeploy,
                            disabled: status === 'DEPLOYING' || !fileObject
                        }, 
                            React.createElement('i', { className: `fa-solid ${status === 'DEPLOYING' ? 'fa-spinner fa-spin' : 'fa-paper-plane'}` }),
                            React.createElement('span', null, status === 'DEPLOYING' ? 'Edge Transmitting...' : `Deploy to zip2web.edgeone.dev`)
                        ),

                        React.createElement('div', { className: 'terminal-box custom-scrollbar mb-4', ref: terminalRef },
                            logs.map((log, i) => React.createElement('div', { key: i, className: `log-line ${log.type === 'success' ? 'log-success' : log.type === 'info' ? 'log-info' : ''}` }, log.msg)),
                            
                            deployData && React.createElement('div', { className: 'mt-6 p-5 bg-teal-500/10 border border-teal-500/30 rounded-xl animate-up' },
                                React.createElement('div', { className: 'flex items-center gap-2 mb-3' },
                                    React.createElement('div', { className: 'w-1.5 h-1.5 rounded-full bg-teal-500 animate-pulse' }),
                                    React.createElement('p', { className: 'text-[10px] font-black text-teal-500 uppercase tracking-widest' }, 'Deployment Manifest')
                                ),
                                React.createElement('div', { className: 'bg-black/60 p-4 rounded-lg border border-zinc-800' },
                                    React.createElement('a', { 
                                        href: '#', 
                                        onClick: handleLaunch,
                                        className: 'url-display text-white text-xs font-mono transition-colors flex items-start gap-2 break-all'
                                    }, 
                                        React.createElement('i', { className: 'fa-solid fa-link mt-1 text-teal-500' }),
                                        deployData.visual
                                    )
                                ),
                                React.createElement('p', { className: 'mt-3 text-[9px] text-zinc-600 font-medium' }, 'Note: Clicking this link executes the EdgeOne instance for the current session.')
                            )
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App, null));
    </script>
</body>
</html>
