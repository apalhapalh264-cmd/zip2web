<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy Engine | RizzXD</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
:root { --bg-color: #f0f8ff; --primary: #2563eb; --secondary: #ffc107; --success: #00b894; --danger: #ff4757; --black: #000000; --white: #ffffff; }
body { background-color: var(--bg-color); font-family: 'JetBrains Mono', monospace; color: var(--black); padding: 20px; }
.nb-card { background-color: var(--white); border: 4px solid var(--black); box-shadow: 8px 8px 0px var(--black); padding: 20px; margin-bottom: 30px; transition: all 0.2s ease; }
.nb-card:hover { box-shadow: 12px 12px 0px var(--black); transform: translate(-2px, -2px); }
.nb-btn { background-color: var(--primary); color: var(--white); border: 3px solid var(--black); box-shadow: 5px 5px 0px var(--black); font-weight: 800; padding: 10px 20px; text-transform: uppercase; border-radius: 0; transition: all 0.1s; width: 100%; margin-bottom: 10px; text-decoration: none; display: inline-block; text-align: center; cursor: pointer; }
.nb-btn:disabled { background-color: #888; cursor: not-allowed; box-shadow: 2px 2px 0px var(--black); transform: translate(3px, 3px); }
.nb-btn:not(:disabled):hover { background-color: var(--white); color: var(--black); box-shadow: 2px 2px 0px var(--black); transform: translate(3px, 3px); }
.nb-btn-secondary { background-color: var(--white); color: var(--black); }
.nb-btn-danger { background-color: var(--danger); color: var(--white); }
.nb-input { width: 100%; border: 3px solid var(--black); padding: 10px; font-family: 'JetBrains Mono', monospace; margin-bottom: 15px; background: #eee; font-weight: bold; }
.profile-img { width: 100%; height: 250px; object-fit: cover; border: 3px solid var(--black); box-shadow: 5px 5px 0px var(--black); margin-bottom: 15px; }
.badge-role { background-color: var(--black); color: var(--white); padding: 5px 10px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
.preview-box { background-color: #1e1e1e; color: #00ff00; border: 3px solid var(--black); min-height: 150px; padding: 20px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; font-weight: bold; box-shadow: inset 4px 4px 0px rgba(0,0,0,0.5); word-break: break-all; font-size: 0.9rem; overflow-y: auto; max-height: 300px; }
.log-line { margin-bottom: 5px; }
.result-link { background: var(--success); color: white; padding: 10px; border: 2px solid black; text-decoration: none; margin-top: 10px; display: inline-block; width: 100%; text-align: center; }
.error-msg { color: var(--danger); }
h1, h2, h3, h4 { font-weight: 800; text-transform: uppercase; }
hr { border-top: 3px solid var(--black); opacity: 1; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const { useState, useRef } = React;

    const DeveloperCard = () => {
        return React.createElement('div', { className: 'nb-card' },
            React.createElement('div', { className: 'text-center' },
                React.createElement('img', { src: 'https://files.catbox.moe/m7gr0u.jpg', alt: 'RizzXD Profile', className: 'profile-img' }),
                React.createElement('div', { className: 'badge-role' }, 'DEVELOPER'),
                React.createElement('h3', { className: 'mb-3' }, 'RizzXD'),
                React.createElement('hr', null),
                React.createElement('div', { className: 'd-grid gap-2' },
                    React.createElement('a', { href: 'https://wa.me/6281224595908', className: 'nb-btn', target: '_blank' }, 'WhatsApp'),
                    React.createElement('a', { href: 'https://t.me/RizalPedia', className: 'nb-btn nb-btn-secondary', target: '_blank' }, 'Telegram')
                )
            )
        );
    };

    const DeployMenu = () => {
        const [status, setStatus] = useState('IDLE'); // IDLE, UPLOADING, SUCCESS, ERROR
        const [logs, setLogs] = useState(['> System Ready...']);
        const [deployUrl, setDeployUrl] = useState('');
        const fileInputRef = useRef(null); // Gunakan Ref agar input tidak hilang

        const addLog = (msg) => {
            setLogs(prev => [...prev, `> ${msg}`]);
        };

        const handleFileChange = (e) => {
            if (e.target.files && e.target.files[0]) {
                setStatus('IDLE');
                setDeployUrl('');
                setLogs(['> File selected: ' + e.target.files[0].name]);
            }
        };

        const handleDeploy = async () => {
            const file = fileInputRef.current?.files[0];
            if (!file) {
                addLog('ERROR: No file selected!');
                return;
            }

            setStatus('UPLOADING');
            addLog('Initializing connection to socket.php...');
            
            const formData = new FormData();
            formData.append('file', file);

            try {
                // Point ke socket.php yang sudah dibuat
                const response = await fetch('socket.php', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    addLog('Upload 100% Complete.');
                    addLog('Deploy ID: ' + result.deploy_id);
                    addLog('MKDIR created successfully.');
                    setDeployUrl(result.url);
                    setStatus('SUCCESS');
                } else {
                    // Handle Error dari PHP (Termasuk Rate Limit)
                    setStatus('ERROR');
                    addLog('ERROR: ' + (result.message || 'Unknown server error'));
                }

            } catch (error) {
                setStatus('ERROR');
                addLog('CRITICAL ERROR: ' + error.message);
                addLog('Check your internet or server configuration.');
            }
        };

        const handleReset = () => {
            if (fileInputRef.current) fileInputRef.current.value = "";
            setStatus('IDLE');
            setDeployUrl('');
            setLogs(['> System Reset.', '> Waiting for file...']);
        };

        return React.createElement('div', { className: 'nb-card' },
            React.createElement('h2', { className: 'mb-4' }, 'DEPLOY CONTROL PANEL'),
            
            React.createElement('div', { className: 'mb-3' },
                React.createElement('label', { className: 'fw-bold mb-2' }, '1. SELECT SOURCE (HTML/PHP/ZIP)'),
                React.createElement('input', {
                    type: 'file',
                    className: 'nb-input',
                    accept: '.html,.htm,.zip',
                    onChange: handleFileChange,
                    ref: fileInputRef
                })
            ),

            React.createElement('hr', { className: 'my-4' }),

            React.createElement('label', { className: 'fw-bold mb-2' }, '2. EXECUTION'),
            React.createElement('div', { className: 'row g-3' },
                React.createElement('div', { className: 'col-md-8' },
                    React.createElement('button', {
                        className: 'nb-btn',
                        disabled: status === 'UPLOADING' || !fileInputRef.current?.files?.length,
                        onClick: handleDeploy
                    }, status === 'UPLOADING' ? 'CONNECTING SOCKET...' : '🚀 DEPLOY TO SERVER')
                ),
                React.createElement('div', { className: 'col-md-4' },
                    React.createElement('button', {
                        className: 'nb-btn nb-btn-danger',
                        onClick: handleReset
                    }, '🗑 RESET')
                )
            ),

            React.createElement('hr', { className: 'my-4' }),
            
            React.createElement('h4', { className: 'mb-2' }, 'LIVE TERMINAL LOG'),
            React.createElement('div', { className: 'preview-box' },
                logs.map((log, idx) => React.createElement('div', { key: idx, className: log.includes('ERROR') ? 'log-line error-msg' : 'log-line' }, log)),
                
                status === 'SUCCESS' && React.createElement(React.Fragment, null, 
                    React.createElement('div', { className: 'mt-3 text-white' }, '---------------------------------'),
                    React.createElement('div', { className: 'text-success fw-bold' }, '✅ DEPLOYMENT SUCCESSFUL'),
                    React.createElement('a', { 
                        href: deployUrl, 
                        className: 'result-link',
                        target: '_blank'
                    }, 'OPEN DEPLOYED SITE ↗')
                )
            )
        );
    };

    const App = () => {
        return React.createElement('div', { className: 'container py-5' },
            React.createElement('div', { className: 'row mb-4' },
                React.createElement('div', { className: 'col-12 text-center' },
                    React.createElement('h1', { className: 'display-4 fw-bold' }, 'DEPLOY.POJOKKELAS.WEB.ID')
                )
            ),
            React.createElement('div', { className: 'row' },
                React.createElement('div', { className: 'col-lg-4' },
                    React.createElement(DeveloperCard, null)
                ),
                React.createElement('div', { className: 'col-lg-8' },
                    React.createElement(DeployMenu, null)
                )
            )
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App, null));
</script>
<script src="security.js"></script>

</body>
</html>
